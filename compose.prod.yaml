name: visioconf-prod
services:
    mongodb:
        image: mongo:8.0
        container_name: mongodb-prod
        restart: always
        volumes:
            - mongodb_prod_data:/data/db
        networks:
            - prod_network
        environment:
            - MONGO_INITDB_DATABASE=visioconf

    backend:
        build:
            context: ./BACKEND
            dockerfile: Dockerfile.prod
        container_name: backend-prod
        restart: always
        depends_on:
            - mongodb
        networks:
            - prod_network
        environment:
            - MONGO_URI=mongodb://mongodb:27017/visioconf
            - NODE_ENV=prod
            - FRONTEND_URL=http://localhost
        env_file:
            - path: ./BACKEND/.env
              required: false

    frontend:
        build:
            context: ./FRONTENDV2
            dockerfile: Dockerfile.prod
            args:
                - REACT_APP_BACKEND_API_URL=http://localhost
        container_name: frontend-prod
        restart: always
        depends_on:
            - backend
        ports:
            - "80:80"
            - "443:443"
        networks:
            - prod_network
        volumes:
            - ./.certs:/etc/nginx/certs:ro
            - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
    mongodb_prod_data:
        driver: local

networks:
    prod_network:
        driver: bridge
